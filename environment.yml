# Conda environment for the in-house vessel detection project.
#
#   conda env create -f environment.yml
#   conda activate IHVesselDetection
#
# Versions are the ones the pipeline and model were last run with.
# PyTorch from PyPI is the CPU build on Windows and the CUDA build on Linux.
# For a Windows GPU machine, install torch/torchvision afterwards with the
# command from https://pytorch.org/get-started/locally/.
name: IHVesselDetection
channels:
  - conda-forge
dependencies:
  - python=3.11
  # Geospatial stack (from conda-forge so GDAL/PROJ binaries match)
  - rasterio=1.4
  - geopandas=1.2
  - pyogrio=0.13
  - pyproj=3.7
  - shapely=2.2
  # Scientific stack
  - numpy=2.4
  - scipy=1.17
  - pandas=3.0
  - matplotlib=3.11
  - tqdm
  - pip
  - pip:
      - torch==2.14.1
      - torchvision==0.29.1
      - opencv-python-headless==5.0.0.93
      # Only needed by 0.0-Import_Mediterranean_Scenes.py to download MTL files
      - planetary-computer
      - pystac-client
